  windowsAdvisoryPrerequisite:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/apex-demo/controller-windows-admission-20261105' && inputs.mode == 'windows-advisory-prerequisite'
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.0'
          architecture: x64
      - name: Native prerequisite only (no APEX build, broker, auth tokens or UI)
        shell: pwsh
        run: ./tools/windows/Test-WindowsAdvisoryPrerequisite.ps1 -Phase '${{ inputs.phase }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-Advisory-Prerequisite-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-advisory-prerequisite/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
