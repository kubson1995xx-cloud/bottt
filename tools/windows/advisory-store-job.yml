  windowsAdvisoryRefresh:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/apex-demo/controller-windows-admission-20261105' && inputs.mode == 'windows-advisory-refresh'
    runs-on: windows-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.0'
          architecture: x64
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.427'
      - name: I1 native storage RED or full advisory GREEN, no upstream reinstall
        shell: pwsh
        run: ./tools/windows/Test-WindowsAdvisoryStore.ps1 -Phase '${{ inputs.phase }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-Advisory-Store-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-advisory-store/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
