name: APEX Windows DEMO
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full-delivery packages; task1-source/task2-source/task3-source/task4-source validate only the named source prerequisite'
        type: choice
        options: [full-delivery, okx-task1-source, task1-source, task2-source, task3-source, task4-source, task5-package, task6-acceptance]
        default: full-delivery
      phase:
        description: 'Source evidence label only; RED failures still fail the run'
        type: choice
        options: [red, green]
        default: green
      okx_gate:
        description: 'OKX Task1 source subset; credentials only credential/DPAPI; windows-setup only setup/startup'
        type: choice
        options: [all, windows-setup, credentials]
        default: all
  push:
    branches: ["claude/beautiful-mccarthy-9cibo1"]
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'tests/**'
      - 'tools/**'
      - 'docs/**'
      - 'APEX.Trading.Demo.sln'
      - 'package*.json'
      - '.github/workflows/windows-demo.yml'
permissions:
  contents: read
jobs:
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full-delivery'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/naval/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: APEX-NAVAL-COMMAND-Windows-x64
          run-id: 41167079728
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/scalar-original-input
      # Builder runs tests/package/Test-NavalPackage.ps1 on independently extracted ZIP
      # (CRC, SHA readback, native EXE private ACL/roles/assets/restart/Emergency).
      # Old artifact above is ONLY the reviewer's causal scalar fixture. Final
      # runtime and ALL mandatory suites come from the fresh builder below.
      - name: Fresh full Windows delivery, native Package/Browser and isolated smoke (PowerShell 5.1)
        shell: powershell
        run: ./tools/windows/Test-FinalDelivery.ps1 -OriginalDownload "$env:RUNNER_TEMP/scalar-original-input"
      - name: Test archive separately (not part of product)
        id: archive
        continue-on-error: true
        shell: powershell
        run: |
          Push-Location "$env:RUNNER_TEMP/apex-final-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT/sdk"
          try { dotnet test "$env:GITHUB_WORKSPACE/tests/Apex.AiLab.Tests/Apex.AiLab.Tests.csproj" -c Release --logger "trx;LogFileName=archive.trx" --results-directory "$env:RUNNER_TEMP/archive-tests" } finally { Pop-Location }
      - name: Report archive failure without blocking DEMO product
        if: steps.archive.outcome == 'failure'
        shell: powershell
        run: Write-Output "::warning::Archived AI Lab tests failed; see archive.trx. This module is not shipped and does not gate the DEMO package."
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: APEX-NAVAL-COMMAND-Windows-x64
          path: |
            ${{ runner.temp }}/APEX-NAVAL-COMMAND-Windows-x64.zip
            ${{ runner.temp }}/APEX-NAVAL-COMMAND-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Task7-Failed-Candidate-${{ github.run_id }}-${{ github.run_attempt }}-NOT-ACCEPTED
          path: |
            ${{ runner.temp }}/APEX-NAVAL-COMMAND-Windows-x64.zip
            ${{ runner.temp }}/APEX-NAVAL-COMMAND-Windows-x64.zip.sha256
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Task7-Windows-Evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/final-public-evidence/**
            ${{ runner.temp }}/archive-tests/*.trx
          if-no-files-found: error
          retention-days: 30
  nativeTask6:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'task6-acceptance' && github.ref == 'refs/heads/feature/apex-naval-command'
    runs-on: windows-latest
    timeout-minutes: 18
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: Task7-Failed-Candidate-41205686076-1-NOT-ACCEPTED
          run-id: 41205686076
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/task6-input
      - uses: actions/download-artifact@v4
        with:
          name: Task7-Windows-Evidence-41205686076-1
          run-id: 41205686076
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/task6-prior-evidence
      - uses: actions/download-artifact@v4
        with:
          name: APEX-NAVAL-COMMAND-Windows-x64
          run-id: 41167079728
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/task6-legacy-input
      - name: No-login acceptance on exact fresh candidate (PowerShell 5.1; no runtime rebuild)
        shell: powershell
        run: ./tools/windows/Test-Task6Acceptance.ps1 -Download "$env:RUNNER_TEMP/task6-input" -PriorEvidence "$env:RUNNER_TEMP/task6-prior-evidence" -LegacyDownload "$env:RUNNER_TEMP/task6-legacy-input"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Task6-Windows-Evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/apex-task6-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/apex-task6-${{ github.run_id }}-${{ github.run_attempt }}/*.trx
            ${{ runner.temp }}/apex-task6-${{ github.run_id }}-${{ github.run_attempt }}/*.sha256
          if-no-files-found: error
          retention-days: 30
  nativePackage:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'task5-package' && github.ref == 'refs/heads/feature/apex-naval-command'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/naval/package-lock.json
      - name: Task5 engineering candidate (not Task6 UI or final delivery)
        shell: powershell
        run: ./tools/windows/Test-PackageCandidate.ps1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: APEX-NAVAL-COMMAND-Windows-x64
          path: |
            ${{ runner.temp }}/APEX-NAVAL-COMMAND-Windows-x64.zip
            ${{ runner.temp }}/APEX-NAVAL-COMMAND-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Task5-Failed-Candidate-${{ github.run_id }}-${{ github.run_attempt }}-NOT-ACCEPTED
          path: |
            ${{ runner.temp }}/APEX-NAVAL-COMMAND-Windows-x64.zip
            ${{ runner.temp }}/APEX-NAVAL-COMMAND-Windows-x64.zip.sha256
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Task5-Windows-Evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/apex-task5-package-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/APEX-NAVAL-COMMAND-Windows-x64-build-evidence/*.json
            ${{ runner.temp }}/APEX-NAVAL-COMMAND-Windows-x64/Weryfikacja/*.trx
            ${{ runner.temp }}/APEX-NAVAL-COMMAND-Windows-x64/Weryfikacja/*.json
            ${{ runner.temp }}/APEX-NAVAL-COMMAND-Windows-x64/Weryfikacja/frontend-*.txt
            ${{ runner.temp }}/APEX-NAVAL-COMMAND-Windows-x64-package-evidence/*.json
            ${{ runner.temp }}/APEX-NAVAL-COMMAND-Windows-x64-package-evidence/*.trx
            ${{ runner.temp }}/APEX-NAVAL-COMMAND-Windows-x64-package-evidence/*.sha256
            ${{ runner.temp }}/APEX-NAVAL-COMMAND-Windows-x64-smoke-evidence/summary.json
          if-no-files-found: error
          retention-days: 30
  okxTask1Source:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'okx-task1-source' && github.ref == 'refs/heads/feature/apex-naval-command'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.427'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/naval/package-lock.json
      - name: OKX Task1 source only (no package, secure UI or broker)
        shell: powershell
        env:
          OKX_TASK1_PHASE: ${{ inputs.phase }}
          OKX_TASK1_GATE: ${{ inputs.okx_gate }}
        run: ./tools/windows/Test-OkxCompositionSource.ps1 -Phase $env:OKX_TASK1_PHASE -Gate $env:OKX_TASK1_GATE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Okx-Task1-Windows-Source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/apex-okx-task1-source-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/apex-okx-task1-source-${{ github.run_id }}-${{ github.run_attempt }}/*.log
            ${{ runner.temp }}/apex-okx-task1-source-${{ github.run_id }}-${{ github.run_attempt }}/*.trx
            ${{ runner.temp }}/apex-okx-task1-source-${{ github.run_id }}-${{ github.run_attempt }}/sdk-selection/global.json
          if-no-files-found: error
          retention-days: 30
  nativeSource:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'task1-source' && github.ref == 'refs/heads/feature/apex-naval-command'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Native Task1 source tests only (no broker or package)
        shell: powershell
        env:
          TASK1_PHASE: ${{ inputs.phase }}
        run: ./tools/windows/Test-PrivateDataSource.ps1 -Phase $env:TASK1_PHASE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Task1-Windows-Source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/apex-task1-source-${{ github.run_id }}-${{ github.run_attempt }}/*
          if-no-files-found: error
          retention-days: 30
  nativePresentation:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'task2-source' && github.ref == 'refs/heads/feature/apex-naval-command'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Native Task2 real export and parser contracts only (PowerShell 5.1)
        shell: powershell
        env:
          TASK2_PHASE: ${{ inputs.phase }}
        run: ./tools/windows/Test-PresentationSource.ps1 -Phase $env:TASK2_PHASE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Task2-Windows-Source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/apex-task2-source-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/apex-task2-source-${{ github.run_id }}-${{ github.run_attempt }}/*.log
            ${{ runner.temp }}/apex-task2-source-${{ github.run_id }}-${{ github.run_attempt }}/*.trx
            ${{ runner.temp }}/apex-task2-source-${{ github.run_id }}-${{ github.run_attempt }}/public-presentation/*.json
          if-no-files-found: error
          retention-days: 30
  nativeStartup:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'task4-source' && github.ref == 'refs/heads/feature/apex-naval-command'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/naval/package-lock.json
      - name: Native Task4 startup source tests only (PowerShell 5.1)
        shell: powershell
        env:
          TASK4_PHASE: ${{ inputs.phase }}
        run: ./tools/windows/Test-StartupSource.ps1 -Phase $env:TASK4_PHASE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Task4-Windows-Source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/apex-task4-source-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/apex-task4-source-${{ github.run_id }}-${{ github.run_attempt }}/*.log
            ${{ runner.temp }}/apex-task4-source-${{ github.run_id }}-${{ github.run_attempt }}/*.trx
            ${{ runner.temp }}/apex-task4-source-${{ github.run_id }}-${{ github.run_attempt }}/sdk-selection/global.json
          if-no-files-found: error
          retention-days: 30
  nativeLocalSetup:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'task3-source' && github.ref == 'refs/heads/feature/apex-naval-command'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/naval/package-lock.json
      - name: Native Task3 setup and DPAPI source tests only (PowerShell 5.1)
        shell: powershell
        env:
          TASK3_PHASE: ${{ inputs.phase }}
        run: ./tools/windows/Test-LocalSetupSource.ps1 -Phase $env:TASK3_PHASE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Task3-Windows-Source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/apex-task3-source-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/apex-task3-source-${{ github.run_id }}-${{ github.run_attempt }}/*.log
            ${{ runner.temp }}/apex-task3-source-${{ github.run_id }}-${{ github.run_attempt }}/*.trx
            ${{ runner.temp }}/apex-task3-source-${{ github.run_id }}-${{ github.run_attempt }}/public-presentation/*.json
            ${{ runner.temp }}/apex-task3-source-${{ github.run_id }}-${{ github.run_attempt }}/sdk-selection/global.json
          if-no-files-found: error
          retention-days: 30
