<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apex-token" content="__APEX_TOKEN__">
  <title>APEX Trading AI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233987e5'/%3E%3Cpath d='M8 23 16 8l8 15h-4.5L16 16l-3.5 7z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Nawigacja">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 19 12 4l8 15h-4.2L12 11.6 8.2 19z" fill="#fff"/></svg>
        </div>
        <div>
          <div class="brand-name">APEX Trading AI</div>
          <div class="brand-sub">Silnik wieloplatformowy</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <button data-view="dashboard" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Pulpit</button>
        <button data-view="decisions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="5" r="2.2"/><circle cx="12" cy="19" r="2.2"/><circle cx="19" cy="12" r="2.2"/><path d="M7 11l3.5-4.5M7 13l3.5 4.5M14 6.5 17 10.5M14 17.5l3-4"/></svg>AI Decision Center</button>
        <button data-view="positions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>Pozycje i wyniki</button>
        <button data-view="strategies"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/></svg>Strategie</button>
        <button data-view="instruments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3Z"/></svg>Instrumenty</button>
        <button data-view="risk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg>Ryzyko i bezpieczeństwo</button>
        <button data-view="connections"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 7H7a5 5 0 0 0 0 10h2M15 7h2a5 5 0 0 1 0 10h-2M8 12h8"/></svg>Połączenia platform</button>
        <button data-view="diagnostics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12h3l3-7 4 14 3-7h3"/></svg>Diagnostyka i dziennik</button>
      </nav>
      <div class="sidebar-foot">
        <div class="host-state" id="hostState"><span class="badge neutral"><span class="dot"></span>łączenie…</span></div>
        <div class="theme-toggle" role="group" aria-label="Motyw">
          <button data-theme-set="dark" aria-pressed="true">Ciemny</button>
          <button data-theme-set="light" aria-pressed="false">Jasny</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <h1 id="viewTitle">Pulpit</h1>
        <div class="account-tabs" id="accountTabs" role="group" aria-label="Konta"></div>
        <div class="spacer"></div>
        <span class="updated" id="updated">—</span>
      </div>

      <section class="view active" id="view-dashboard" aria-live="polite"></section>
      <section class="view" id="view-decisions"></section>
      <section class="view" id="view-positions"></section>
      <section class="view" id="view-strategies"></section>
      <section class="view" id="view-instruments"></section>
      <section class="view" id="view-risk"></section>
      <section class="view" id="view-connections"></section>
      <section class="view" id="view-diagnostics"></section>
    </main>
  </div>
  <div class="toasts" id="toasts" aria-live="assertive"></div>
  <script src="app.js"></script>
  <script src="decision-center.js"></script>
</body>
</html>
